<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="description" content="TrackMyTime - a simple office-hours tracker by Nikkhil Deshmukkh. Your hours stay on your own laptop.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>TrackMyTime</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232a78d6'/%3E%3Cpath d='M16 7v9h7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f2f4f7;--surface-3:#e9ecf1;
  --border:#e4e7ec;--border-strong:#d0d5dd;
  --text:#101828;--text-2:#475467;--text-3:#667085;
  --primary:#101828;--primary-text:#ffffff;--primary-hover:#344054;
  --link:#1d63c4;--focus:#2a78d6;
  --work:#2a78d6;--break:#eb6834;--lunch:#1baf7a;--away:#a3abb8;
  --good:#067647;--good-bg:#ecfdf3;--bad:#b42318;--bad-bg:#fef3f2;
  --warn-bg:#fffaeb;--warn-border:#fedf89;--warn-text:#93370d;
  --grid:#eaecf0;--target:#344054;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.22),0 4px 8px -4px rgba(16,24,40,.08);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c111d;--surface:#151a25;--surface-2:#1d2330;--surface-3:#272e3c;
    --border:#262d3a;--border-strong:#363f4f;
    --text:#f5f5f6;--text-2:#cecfd2;--text-3:#94969c;
    --primary:#f5f5f6;--primary-text:#0c111d;--primary-hover:#d0d5dd;
    --link:#6aa5f0;--focus:#6aa5f0;
    --work:#3987e5;--break:#d95926;--lunch:#199e70;--away:#5d6676;
    --good:#47cd89;--good-bg:rgba(71,205,137,.12);--bad:#f97066;--bad-bg:rgba(249,112,102,.12);
    --warn-bg:rgba(253,176,34,.09);--warn-border:rgba(253,176,34,.32);--warn-text:#fec84b;
    --grid:#232a36;--target:#cecfd2;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c111d;--surface:#151a25;--surface-2:#1d2330;--surface-3:#272e3c;
  --border:#262d3a;--border-strong:#363f4f;
  --text:#f5f5f6;--text-2:#cecfd2;--text-3:#94969c;
  --primary:#f5f5f6;--primary-text:#0c111d;--primary-hover:#d0d5dd;
  --link:#6aa5f0;--focus:#6aa5f0;
  --work:#3987e5;--break:#d95926;--lunch:#199e70;--away:#5d6676;
  --good:#47cd89;--good-bg:rgba(71,205,137,.12);--bad:#f97066;--bad-bg:rgba(249,112,102,.12);
  --warn-bg:rgba(253,176,34,.09);--warn-border:rgba(253,176,34,.32);--warn-text:#fec84b;
  --grid:#232a36;--target:#cecfd2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.25}
h2{font-size:20px;font-weight:650}
h3{font-size:15px;font-weight:650}
p{margin:0}
.muted{color:var(--text-3)}
.small{font-size:12.5px}
.strong{font-weight:650;color:var(--text)}
.good{color:var(--good)}
.bad{color:var(--bad)}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;white-space:nowrap}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-txt small{font-size:11.5px;font-weight:500;color:var(--text-3);letter-spacing:.01em}
.credit{max-width:1180px;margin:0 auto;padding:0 24px 28px;text-align:center;color:var(--text-3);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:7px 12px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:560;white-space:nowrap}
.tabs a:hover{background:var(--surface-2);color:var(--text)}
.tabs a[aria-current="page"]{background:var(--surface-3);color:var(--text)}
.tabs .sm{display:none}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:560;color:var(--text-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--away);flex:none;display:inline-block}
.dot.k-Work{background:var(--work)}.dot.k-Lunch{background:var(--lunch)}.dot.k-Break{background:var(--break)}.dot.k-Away,.dot.k-Off{background:var(--away)}
.live .dot.pulse{box-shadow:0 0 0 0 currentColor;animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,120,214,.45)}70%{box-shadow:0 0 0 7px rgba(42,120,214,0)}100%{box-shadow:0 0 0 0 rgba(42,120,214,0)}}
@media (prefers-reduced-motion:reduce){.live .dot.pulse{animation:none}}

main{max-width:1180px;margin:0 auto;padding:24px 24px 48px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{color:var(--text-3);margin-top:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:20px}
.grid-2>.card+.card,.grid-today>.card+.card{margin-top:0}
.pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 0}
.card-head .sub{color:var(--text-3);font-size:13px}
.card-body{padding:14px 20px 20px}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn-lg{height:46px;padding:0 22px;font-size:15px;border-radius:10px}
.btn-sm{height:30px;padding:0 11px;font-size:13px;border-radius:7px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--bad)}
.btn-icon{width:32px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:560;font-size:13px;color:var(--text-2)}
.input,select.input,textarea.input{height:38px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);padding:0 11px;color:var(--text);min-width:0}
textarea.input{width:100%;height:auto;padding:10px 12px;line-height:1.5;resize:vertical;font-family:inherit}
.input:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}
.hint{font-size:12.5px;color:var(--text-3);font-weight:400}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.12)}

.switch{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:12px 0}
.switch+.switch{border-top:1px solid var(--border)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:38px;height:22px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;transition:background-color .15s;margin-top:1px}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--work);border-color:var(--work)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--focus);outline-offset:2px}
.switch .txt b{display:block;font-weight:600;color:var(--text)}
.switch .txt span{color:var(--text-3);font-size:13px}

/* ---------- today ---------- */
.grid-today{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;align-items:start}
.col>*+*{margin-top:20px}
.hero{padding:22px 24px 24px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-weight:600;font-size:13px;color:var(--text)}
.pill .muted{font-weight:500}
.hero-num{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:18px}
.hero-num small{font-size:20px;font-weight:600;color:var(--text-3);letter-spacing:-.01em;margin-left:6px}
.hero-cap{color:var(--text-2);margin-top:6px;font-size:15px}
.progress{position:relative;height:10px;border-radius:5px;background:var(--surface-3);margin-top:18px;overflow:hidden}
.progress>span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--work);transition:width .4s}
.progress>i{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface);opacity:.9;z-index:1}
.hero-cap2{color:var(--text-2);margin-top:2px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat .lbl{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);font-weight:560}
.stat .val{font-size:18px;font-weight:650;margin-top:2px}
.stat .cnt{font-size:12px;color:var(--text-3)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px}
.hero-main .hero-num{margin-top:0}
.hero-note{color:var(--text-3);font-size:13px;margin-top:14px}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:var(--radius);padding:14px 16px}
.banner .b-text{flex:1;min-width:220px}
.banner .b-text > b{display:block;color:var(--text)}
.banner .b-text span b{color:var(--text)}
.banner .b-text span{color:var(--text-2);font-size:13.5px}
.offline{max-width:1180px;margin:16px auto 0;padding:0 24px}
.offline .banner{background:var(--bad-bg);border-color:transparent}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--border)}
.tl li:first-child{border-top:0}
.tl .bar{width:4px;height:34px;border-radius:2px;background:var(--away);justify-self:center}
.tl .k-Work .bar{background:var(--work)}.tl .k-Lunch .bar{background:var(--lunch)}.tl .k-Break .bar{background:var(--break)}
.tl .k-Off .bar{background:repeating-linear-gradient(180deg,var(--away) 0 4px,transparent 4px 7px)}
.tl .t1{font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .t2{color:var(--text-3);font-size:13px}
.tl .dur{font-weight:650;text-align:right;white-space:nowrap}
.tl .act{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.tl li.pending{background:linear-gradient(90deg,var(--warn-bg),transparent 70%);margin:0 -20px;padding-left:20px;padding-right:20px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:11.5px;font-weight:600}
.tag.now{background:var(--work);border-color:var(--work);color:#fff}
.chipbtn{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:12.5px;cursor:pointer;color:var(--text)}
.chipbtn:hover{background:var(--surface-2)}
.empty{padding:28px 8px;text-align:center;color:var(--text-3)}

/* week card */
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:15px;color:var(--text-3);font-weight:600;letter-spacing:0}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.kv .k{font-size:12.5px;color:var(--text-3);font-weight:560}
.kv .v{font-size:17px;font-weight:650}
.kv4{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.kv4 .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{display:flex;gap:8px;align-items:baseline;margin-top:8px;color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:16px 0}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--text-3);font-size:11.5px}
.chart .axis{font-size:11px}
.chart .lbl-today{fill:var(--text);font-weight:700}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .bar-work{fill:var(--work)}
.chart .bar-today{fill:var(--work);opacity:.55}
.chart .tgt{stroke:var(--target);stroke-width:2;stroke-linecap:round}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--surface-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--text-2);font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend i.l-tgt{height:2px;border-radius:1px;background:var(--target);vertical-align:3px}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--primary);color:var(--primary-text);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}

/* reports */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.nav{display:inline-flex;align-items:center;gap:4px}
.nav .lbl{min-width:170px;text-align:center;font-weight:650;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12.5px;color:var(--text-3);font-weight:560}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi .n{font-size:12px;color:var(--text-3)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--text-3);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text-2)}
.tbl td.strong{color:var(--text)}
.tbl .r{text-align:right}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.is-today td:first-child{box-shadow:inset 3px 0 0 var(--work)}
.tbl tfoot td{font-weight:700;color:var(--text);border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:560;color:var(--text-2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--text-3);font-weight:600;padding:0 4px 4px}
.cal .c{min-height:86px;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--text);font:inherit}
.cal .c:hover{border-color:var(--border-strong);background:var(--surface-2)}
.cal .c.off{background:var(--surface-2)}
.cal .c.today{outline:2px solid var(--work);outline-offset:-1px}
.cal .c.blank{visibility:hidden}
.cal .n{font-size:12px;color:var(--text-3);font-weight:600}
.cal .w{font-size:15px;font-weight:700;margin-top:auto}
.cal .s{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d{font-size:11.5px;font-weight:600}

/* leave & holidays */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.list li:first-child{border-top:0}
.list .date{width:96px;flex:none;font-weight:600;color:var(--text)}
.list .date span{display:block;font-size:12px;color:var(--text-3);font-weight:500}
.list .name{flex:1;min-width:0;color:var(--text-2)}
.list .name b{color:var(--text);font-weight:600}
.list li.past{opacity:.6}
.preview{max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:12px}
.preview table{width:100%;border-collapse:collapse;font-size:13px}
.preview td,.preview th{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}
.preview th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--text-3)}
.daypick{display:flex;gap:6px;flex-wrap:wrap}
.daypick button{width:46px;height:36px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;cursor:pointer;color:var(--text-2)}
.daypick button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-text)}

/* modal, menu, toast */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow-y:auto;animation:fade .12s}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;border:1px solid var(--border);animation:rise .16s}
.modal.wide{max-width:720px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 0}
.modal-head p{color:var(--text-3);margin-top:3px}
.modal-body{padding:16px 22px 4px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 20px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.menu{position:fixed;z-index:70;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.menu .mh{font-size:12px;color:var(--text-3);padding:6px 10px 4px}

<script>
/* =====================================================================
   TrackMyTime - engine (runs inside the browser)
   Made by Nikkhil Deshmukkh
   Same rules as the Windows version: the log is a list of lines
   "Date,Time,Event,Note" exactly like TimeLog.csv, so old data imports 1:1.
   ===================================================================== */
(function (root) {
  'use strict';

  var MIN = 60000, HOUR = 3600000;
  var HEADER = 'Date,Time,Event,Note';
  var VERSION = '1.2';
  var GAP = 3 * MIN;                 // a longer silence means the laptop slept or was off

  /* ---------------- small helpers ---------------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(t) { var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dayStart(t) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function addDays(t, n) { var d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n).getTime(); }
  function keyToMs(k) { var p = String(k).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getTime(); }
  function hms(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function iso(t) { return t == null ? null : dayKey(t) + 'T' + hms(t); }
  function wholeSec(t) { return Math.floor(t / 1000) * 1000; }
  function secs(ms) { return Math.floor(ms / 1000); }
  function clock(t) { var d = new Date(t), h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(d.getMinutes()) + ' ' + ap; }
  function span(ms) {
    var neg = ms < 0; if (neg) ms = -ms;
    var mins = Math.floor(ms / MIN);
    var s = Math.floor(mins / 60) + 'h ' + pad(mins % 60) + 'm';
    return neg ? '-' + s : s;
  }
  function weekStart(t) { var d = new Date(dayStart(t)); return addDays(d.getTime(), -((d.getDay() + 6) % 7)); }
  function toBool(v, def) {
    if (v === undefined || v === null) return def;
    if (typeof v === 'boolean') return v;
    var s = String(v).trim().toLowerCase();
    if (['true', 'yes', '1', 'on'].indexOf(s) >= 0) return true;
    if (['false', 'no', '0', 'off'].indexOf(s) >= 0) return false;
    return def;
  }

  /* ---------------- reading dates and times written by people or Excel ---------------- */
  var MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12,
    january: 1, february: 2, march: 3, april: 4, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
  function mkDate(y, m, d) {
    if (y < 100) y += 2000;
    if (!(y >= 1990 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    var t = new Date(y, m - 1, d);
    return t.getMonth() === m - 1 ? t.getTime() : null;
  }
  function parseDateText(s) {
    s = String(s == null ? '' : s).trim().replace(/^"|"$/g, '').trim();
    var m;
    if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(s))) return mkDate(+m[1], +m[2], +m[3]);
    if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})$/.exec(s))) return mkDate(+m[3], +m[2], +m[1]);
    if ((m = /^(\d{1,2})[-\s]([A-Za-z]{3,9})\.?[-\s,]+(\d{4}|\d{2})$/.exec(s))) { var mo = MONTHS[m[2].toLowerCase()]; return mo ? mkDate(+m[3], mo, +m[1]) : null; }
    if ((m = /^(\d{4})(\d{2})(\d{2})$/.exec(s))) return mkDate(+m[1], +m[2], +m[3]);
    return null;
  }
  function parseTimeText(s) {
    s = String(s == null ? '' : s).trim().replace(/^"|"$/g, '').trim();
    var m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp])?\.?[Mm]?\.?$/.exec(s);
    if (!m) return null;
    var h = +m[1], mi = +m[2], se = +(m[3] || 0);
    if (m[4]) { var pm = m[4].toLowerCase() === 'p'; if (h === 12) h = 0; if (pm) h += 12; }
    if (h > 23 || mi > 59 || se > 59) return null;
    return ((h * 60 + mi) * 60 + se) * 1000;
  }
  function parseWhen(dateText, timeText) {
    var d = parseDateText(dateText), t = parseTimeText(timeText);
    if (d == null || t == null) return null;
    var x = new Date(d);
    return new Date(x.getFullYear(), x.getMonth(), x.getDate(), Math.floor(t / HOUR), Math.floor(t / MIN) % 60, Math.floor(t / 1000) % 60).getTime();
  }

  function eventName(text) {
    var s = String(text == null ? '' : text).trim().replace(/^"|"$/g, '').trim().toLowerCase();
    if (/^laptop\s*on$/.test(s)) return 'Laptop on';
    if (/^laptop\s*off$/.test(s)) return 'Laptop off';
    if (/^break\s*start$/.test(s)) return 'Break start';
    if (/^break\s*end$/.test(s)) return 'Break end';
    if (/^lunch\s*start$/.test(s)) return 'Lunch start';
    if (/^lunch\s*end$/.test(s)) return 'Lunch end';
    if (/^away$/.test(s)) return 'Away';
    if (/^marked\s+as\s+(work|working|worked)$/.test(s)) return 'Marked as work';
    if (/^marked\s+as\s+lunch$/.test(s)) return 'Marked as lunch';
    if (/^marked\s+as\s+break$/.test(s)) return 'Marked as break';
    if (/^marked\s+as\s+(away|not\s+working)$/.test(s)) return 'Marked as away';
    if (/^half[\s-]*day/.test(s)) return 'Half day leave';
    if (/^(working\s*day|not\s+leave)$/.test(s)) return 'Working day';
    if (/^(day\s*reset|auto)$/.test(s)) return 'Day reset';
    if (/^leave/.test(s)) return 'Leave day';
    return null;
  }
  var MARK_KIND = { 'Marked as work': 'Work', 'Marked as lunch': 'Lunch', 'Marked as break': 'Break', 'Marked as away': 'Away' };
  var MARK_EVENT = { Work: 'Marked as work', Lunch: 'Marked as lunch', Break: 'Marked as break', Away: 'Marked as away' };

  function parseUntil(start, note) {
    if (!note) return null;
    var m = /until\s+(\d{4}-\d{1,2}-\d{1,2}\s+)?(\d{1,2}:\d{2}(?::\d{2})?(?:\s*[ap]m)?)/i.exec(note);
    if (!m) return null;
    var datePart = (m[1] || '').trim() || dayKey(start);
    var end = parseWhen(datePart, m[2]);
    if (end == null) return null;
    if (!m[1] && end <= start) end = addDays(end, 1) + (end - dayStart(end));
    return end > start ? end : null;
  }
  function splitLine(line) {
    var p = line.split(',');
    if (p.length < 3) p = line.split(';');
    if (p.length < 3) p = line.split('\t');
    return p;
  }
  function parseLines(lines, base) {
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line || !line.trim()) continue;
      var p = splitLine(line);
      if (p.length < 3) continue;
      var name = eventName(p[2]);
      if (!name) continue;
      var when = parseWhen(p[0], p[1]);
      if (when == null) continue;
      var note = p.length > 3 ? p.slice(3).join(',').trim().replace(/^"|"$/g, '') : '';
      var until = null;
      if (name === 'Away' || MARK_KIND[name]) { until = parseUntil(when, note); if (until == null) continue; }
      out.push({ when: when, event: name, note: note, until: until, line: base + i + 1 });
    }
    return out;
  }

  /* ---------------- holidays file (Date,Occasion) ---------------- */
  function parseHolidaysText(text) {
    var h = {};
    String(text || '').split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var idx = line.indexOf(',');
      if (idx < 0) idx = line.indexOf(';');
      if (idx < 0) idx = line.indexOf('\t');
      if (idx < 1) return;
      var d = parseDateText(line.slice(0, idx));
      if (d == null) return;
      var name = line.slice(idx + 1).trim().replace(/[,;]+$/, '').trim();
      if (name.length >= 2 && name.charAt(0) === '"' && name.charAt(name.length - 1) === '"') name = name.slice(1, -1).replace(/""/g, '"');
      h[dayKey(d)] = name || 'Holiday';
    });
    return h;
  }
  function holidaysToText(h) {
    var keys = Object.keys(h).sort();
    return 'Date,Occasion\r\n' + keys.map(function (k) { return k + ',"' + String(h[k]).replace(/[\r\n]+/g, ' ').replace(/"/g, '""') + '"'; }).join('\r\n') + (keys.length ? '\r\n' : '');
  }

  /* ---------------- settings ---------------- */
  function cleanSettings(inp) {
    inp = inp || {};
    var o = {};
    var h = parseFloat(inp.DailyHours);
    if (!(h >= 0.5 && h <= 24)) h = 9;
    o.DailyHours = Math.round(h * 100) / 100;
    var src = inp.WorkDays == null ? [1, 2, 3, 4, 5] : [].concat(inp.WorkDays);
    var days = [];
    src.forEach(function (d) { var n = parseInt(d, 10); if (n >= 0 && n <= 6 && days.indexOf(n) < 0) days.push(n); });
    o.WorkDays = days.sort(function (a, b) { return a - b; });
    o.LunchCounts = toBool(inp.LunchCounts, true);
    o.BreaksCount = toBool(inp.BreaksCount, false);
    var m = parseInt(inp.AwayMinutes, 10);
    if (isNaN(m) || m < 0 || m > 240) m = 10;
    o.AwayMinutes = m;
    o.CallsCount = toBool(inp.CallsCount, true);
    o.AskOnReturn = toBool(inp.AskOnReturn, true);
    o.AutoLeave = toBool(inp.AutoLeave, true);
    o.AutoBackup = toBool(inp.AutoBackup, true);
    o.LeaveAlert = toBool(inp.LeaveAlert, true);
    // attendance: at least FullDayHours = full day (needs DailyHours), at least HalfDayHours = half day (needs half), less = no attendance
    var fd = parseFloat(inp.FullDayHours), hd = parseFloat(inp.HalfDayHours);
    if (!(fd > 0 && fd <= o.DailyHours)) fd = Math.min(6, o.DailyHours);
    if (!(hd > 0 && hd <= fd)) hd = Math.min(4, fd);
    o.FullDayHours = Math.round(fd * 100) / 100;
    o.HalfDayHours = Math.round(hd * 100) / 100;
    return o;
  }

  /* ---------------- segments: stretches of Work / Lunch / Break / Away ---------------- */
  function seg(kind, start, end) { return { kind: kind, start: start, end: end }; }
  function paint(segs, a, b, kind) {
    var out = [];
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i], sEnd = s.end;
      if ((sEnd != null && sEnd <= a) || (b != null && s.start >= b)) { out.push(s); continue; }
      if (s.start < a) out.push(seg(s.kind, s.start, a));
      if (b != null && (sEnd == null || sEnd > b)) out.push(seg(s.kind, b, sEnd));
    }
    if (kind !== 'Off') out.push(seg(kind, a, b));
    return out.sort(function (x, y) { return x.start - y.start; });
  }
  function merge(segs) {
    var out = [];
    segs.forEach(function (s) {
      if (s.end != null && s.end <= s.start) return;
      var p = out[out.length - 1];
      if (p && p.kind === s.kind && p.end != null && p.end === s.start) { out[out.length - 1] = seg(p.kind, p.start, s.end); return; }
      out.push(s);
    });
    return out;
  }

  /* =====================================================================

  var h = '<section class="card"><div class="card-head"><h3>' + MONTHS[d.getMonth()] + '</h3><button class="btn btn-ghost btn-sm" data-act="goto-month">Month report ' + ICON.right + '</button></div><div class="card-body"><div class="kv kv4">' +
    '<div><div class="k">Worked so far</div><div class="v">' + fmtDur(m.worked) + '</div></div>' +
    '<div><div class="k">Ahead / behind</div><div class="v">' + signedHtml(m.live) + '</div></div>' +
    '<div><div class="k">Leave taken</div><div class="v">' + plural(m.leaves, 'day') + '</div></div>' +
    '<div><div class="k">Holidays</div><div class="v">' + m.holidays + '</div></div></div>';
  var up = S.upcoming || [];
  h += '<div class="divider"></div><div class="k-title">Coming up</div>';
  if (up.length) {
    h += '<ul class="upcoming">' + up.map(function (x) { return '<li><span class="strong">' + esc(x.name) + '</span><span class="muted">' + dayShort(x.d) + '</span></li>'; }).join('') + '</ul>';
  } else h += '<p class="muted small" style="margin-top:4px">No holidays added yet &mdash; add them under Leave &amp; holidays.</p>';
  var fullMin = S.settings.FullDayHours * 3600, left;
  if (!m.left) left = 'No working days left this month after today.';
  else left = m.left + ' working ' + (m.left === 1 ? 'day' : 'days') + ' left &middot; ' + (m.avgNeed <= fullMin ? 'any full day (' + fmtDur(fullMin) + '+) keeps you on track' : 'about <span class="strong">' + fmtDur(m.avgNeed) + '</span> a day to end on track');
  h += '<div class="line overall"><span class="muted">' + left + '</span></div>';
  return h + '</div></section>';

/* ======================= bar chart ======================= */
function barChart(days, opts) {
  opts = opts || {};
  var today = todayStr();
  var W = Math.max(260, opts.width || (opts.compact ? 340 : 760)), H = opts.height || 220;
  var padL = 30, padR = 6, padT = 10, padB = 24;
  var maxSec = 0;
  days.forEach(function (d) { maxSec = Math.max(maxSec, d.wk, d.tg); });
  var baseStep = maxSec > 12 * 3600 ? 4 : 3;
  var yMax = Math.max(baseStep * 4, Math.ceil(maxSec / 3600 / baseStep) * baseStep);
  var stepH = (H < 130 && yMax % (baseStep * 2) === 0) ? baseStep * 2 : baseStep;
  var pw = W - padL - padR, ph = H - padT - padB, band = pw / days.length;
  var bw = Math.max(4, Math.min(24, band * 0.62));
  var y = function (sec) { return padT + ph - (sec / 3600) / yMax * ph; };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Hours counted per day">';
  for (var g = 0; g <= yMax; g += stepH) {
    var gy = y(g * 3600).toFixed(1);
    s += '<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy + '" y2="' + gy + '"/>';
    s += '<text class="axis" x="' + (padL - 6) + '" y="' + (+gy + 4) + '" text-anchor="end">' + g + 'h</text>';
  }
  var every = band < 16 ? 2 : 1;
  days.forEach(function (d, i) {
    var cx = padL + band * i + band / 2, dt = parseIso(d.d), future = d.d > today, isToday = d.d === today;
    var tip = '<b>' + dayShort(d.d) + '</b><br>' + (STATUS[d.st] || '') + (d.hn ? ': ' + esc(d.hn) : '') +
      attSuffix(d).replace(' &middot; ', '<br>') + (future ? '' : '<br>Counted: ' + fmtDur(d.wk)) + (d.tg ? '<br>Needed: ' + fmtDur(d.tg) : '') +
      (!future && (d.tg || d.wk) ? '<br>' + (isToday ? 'If you leave now: ' : 'Difference: ') + fmtSigned(d.wk - d.tg) : '');
    s += '<rect class="hit" data-act="day" data-date="' + d.d + '" data-tip="' + esc(tip) + '" x="' + (padL + band * i + 1).toFixed(1) + '" y="' + padT + '" width="' + Math.max(1, band - 2).toFixed(1) + '" height="' + ph + '" rx="6"/>';
    if (d.wk > 0) {
      var top = y(d.wk), bx = cx - bw / 2, base = padT + ph, r = Math.min(4, (base - top) / 2, bw / 2);
      s += '<path pointer-events="none" class="' + (isToday && d.live ? 'bar-today' : 'bar-work') + '" d="M' + bx.toFixed(1) + ' ' + base + 'V' + (top + r).toFixed(1) +
        'Q' + bx.toFixed(1) + ' ' + top.toFixed(1) + ' ' + (bx + r).toFixed(1) + ' ' + top.toFixed(1) + 'H' + (bx + bw - r).toFixed(1) +
        'Q' + (bx + bw).toFixed(1) + ' ' + top.toFixed(1) + ' ' + (bx + bw).toFixed(1) + ' ' + (top + r).toFixed(1) + 'V' + base + 'Z"/>';
    } else if (!future && (d.st === 'leave' || d.st === 'autoleave' || d.st === 'holiday')) {
      s += '<text pointer-events="none" x="' + cx.toFixed(1) + '" y="' + (padT + ph - 6) + '" text-anchor="middle" style="font-size:10.5px">' + (band > 40 ? (d.st === 'holiday' ? 'Holiday' : 'Leave') : (d.st === 'holiday' ? 'H' : 'L')) + '</text>';
    }
    var tgv = isToday ? (d.std || 0) : d.tg;
    if (tgv > 0) {
      var ty = y(tgv).toFixed(1), tw = Math.min(bw / 2 + 5, band / 2 - 3);
      s += '<line pointer-events="none" class="tgt" x1="' + (cx - tw).toFixed(1) + '" x2="' + (cx + tw).toFixed(1) + '" y1="' + ty + '" y2="' + ty + '"/>';
    }
    if (i % every === 0 || isToday) {
      var lbl = opts.compact || days.length <= 7 ? (opts.compact ? DOW[dt.getDay()].charAt(0) : DOW[dt.getDay()] + ' ' + dt.getDate()) : String(dt.getDate());
      s += '<text pointer-events="none" class="' + (isToday ? 'lbl-today' : '') + '" x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + lbl + '</text>';
    }
  });
  s += '</svg>';
  s += '<div class="legend"><span><i style="background:var(--work)"></i>Hours counted</span><span><i class="l-tgt"></i>Target</span></div>';
  return s;
}

/* ======================= day details ======================= */
function openDay(date, focusEntries) {
  var ov = openModal('<div data-day="' + date + '">' + modalHead(dayLong(date), 'Loading&hellip;') + '<div class="modal-body"><div class="skeleton" style="height:160px"></div></div></div>', { wide: true, day: date });
  loadDayInto(ov, date, focusEntries);
}
function loadDayInto(ov, date, focusEntries) {

    var d = r.days[0];
    var box = ov.querySelector('[data-day]');
    if (!box) return;
    var sub = (STATUS[d.st] || '') + (d.hn ? ' &middot; ' + esc(d.hn) : '') + attSuffix(d);
    var cur = d.ov || 'auto';
    var future = d.d > todayStr();
    var h = modalHead(dayLong(date), sub) + '<div class="modal-body">';
    h += '<div class="mini-kpis"><div><div class="k">Counted</div><div class="v">' + fmtDur(d.wk) + '</div></div>' +
      '<div><div class="k">Needed</div><div class="v">' + fmtDur(d.tg) + '</div></div>' +
      '<div><div class="k">' + (d.d === todayStr() ? 'If you leave now' : 'Ahead / behind') + '</div><div class="v">' + (future ? '&ndash;' : signedHtml(d.wk - d.tg)) + '</div></div></div>';
    h += '<div class="row" style="justify-content:space-between;margin-bottom:6px"><h4 style="font-size:14px">Timeline</h4><button class="btn btn-sm" data-act="addtime" data-date="' + d.d + '">' + ICON.plus + 'Add time</button></div>';
    h += timelineHtml(d);
    var ents = route('/api/entries?date=' + d.d);
    app.ents = ents;
    if (ents.length) h += '<div class="divider"></div><h4 style="font-size:14px">Entries you added or changed</h4>' +
      '<p class="hint" style="margin:4px 0 0">Your answers to &ldquo;What was it?&rdquo; and times you added. Where they overlap, the newest one wins.</p>' + entriesHtml(ents);
    h += '<div class="divider"></div><h4 style="font-size:14px;margin-bottom:8px">What kind of day was this?</h4><div class="seg" role="group" aria-label="Day type">';
    [['auto', 'Normal'], ['leave', 'Leave'], ['half', 'Half-day leave'], ['work', 'Working day']].forEach(function (o) {
      h += '<button data-act="daystatus" data-date="' + d.d + '" data-status="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '">' + o[1] + '</button>';
    });
    h += '</div><p class="hint" style="margin-top:8px">Normal follows your working days, holidays and the &ldquo;no activity = leave&rdquo; rule. &ldquo;Working day&rdquo; always needs ' + hoursLabel() + ' (use it for &ldquo;not leave&rdquo;).</p>';
    h += '</div><div class="modal-foot"><button class="btn" data-act="close-modal">Done</button></div>';
    var keepScroll = ov.scrollTop;
    box.innerHTML = h;
    var entBox = box.querySelector('.ent');
    if (focusEntries && entBox) entBox.previousElementSibling.previousElementSibling.scrollIntoView({ block: 'start' });
    else ov.scrollTop = keepScroll;
  }, function (e) { toast(e.message, true); });
}
function entriesHtml(list) {
  return '<ul class="ent">' + list.map(function (e, i) {
    var sub = e.future ? 'Later than now &mdash; not counted yet. Probably a typing mistake.' : (e.note ? esc(e.note) : (counts(e.k) || e.k === 'Work' ? 'counted' : 'not counted'));
    return '<li class="' + (e.future ? 'future' : '') + '"><span class="dot k-' + e.k + '"></span><div class="t"><b>' + kindWord(e.k) + '</b> &nbsp;' + fmtTime(e.s) + NDASH + fmtTime(e.e) +
      ' <span class="muted">(' + fmtDur(secsBetween(e.s, e.e)) + ')</span><span class="sub">' + sub + '</span></div>' +
      '<button class="btn btn-sm" data-act="ent-edit" data-i="' + i + '">Edit</button>' +
      '<button class="btn btn-sm btn-ghost btn-danger" data-act="ent-del" data-i="' + i + '">Delete</button></li>';
  }).join('') + '</ul>';
}
function refreshDayModal() {
  app.modals.forEach(function (m) { if (m.opts.day) loadDayInto(m.el, m.opts.day); });
}

function hhmm(v) { var d = parseIso(v); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function openAddTime(date, entry) {
  var now = serverNow();
  var isToday = date === todayStr();
  var from = isToday ? pad(Math.max(0, now.getHours() - 1)) + ':00' : '09:30';
  var to = isToday ? pad(now.getHours()) + ':' + pad(now.getMinutes()) : '18:30';
  if (entry) { date = entry.s.slice(0, 10); from = hhmm(entry.s); to = hhmm(entry.e); }
  app.editing = entry || null;
  var h = modalHead(entry ? 'Change this entry' : 'Add or change time', entry ? 'Fix the times or the kind, then click Save.' : 'Use this for time the tracker missed, e.g. work away from the laptop or a forgotten break.') +
    '<div class="modal-body"><div class="form-grid">' +
    '<label class="field">Date<input class="input" type="date" id="at-date" value="' + date + '"></label>' +
    '<label class="field">From<input class="input" type="time" id="at-from" value="' + from + '"></label>' +
    '<label class="field">To<input class="input" type="time" id="at-to" value="' + to + '"></label></div>' +
    '<div style="margin-top:14px"><div class="hint" style="margin-bottom:6px;font-weight:560;color:var(--text-2)">This time was</div><div class="seg" role="group" id="at-kind">' +
    [['Work', 'Working'], ['Lunch', 'Lunch'], ['Break', 'Break'], ['Away', 'Not working']].map(function (o, i) { return '<button type="button" data-act="seg" data-val="' + o[0] + '" aria-pressed="' + (entry ? entry.k === o[0] : i === 0) + '">' + o[1] + '</button>'; }).join('') +
    '</div></div><label class="field" style="margin-top:14px">Note (optional)<input class="input" id="at-note" maxlength="80" placeholder="e.g. client meeting" value="' + esc(entry ? entry.note : '') + '"></label>' +
    '<p class="at-hint" id="at-hint" aria-live="polite"></p><p class="err-text" id="at-err"></p></div>' +
    '<div class="modal-foot">' + (entry ? '<button class="btn btn-ghost btn-danger" data-act="at-del" style="margin-right:auto">Delete</button>' : '') +
    '<button class="btn" data-act="close-modal">Cancel</button><button class="btn btn-primary" data-act="save-time">Save</button></div>';
  openModal(h);
  ['at-date', 'at-from', 'at-to'].forEach(function (id) { var el = document.getElementById(id); el.addEventListener('input', addTimeHint); el.addEventListener('change', addTimeHint); });
  addTimeHint();
}
function readAddTime() {
  var d = document.getElementById('at-date').value, f = document.getElementById('at-from').value, t = document.getElementById('at-to').value;
  if (!d || !f || !t) return null;
  var a = parseIso(d + 'T' + f + ':00'), b = parseIso(d + 'T' + t + ':00');
  if (b <= a) { b = addDays(b, 1); b.setHours(+t.slice(0, 2), +t.slice(3, 5), 0, 0); }
  return { a: a, b: b };
}
function addTimeHint() {
  var el = document.getElementById('at-hint'); if (!el) return;
  var r = readAddTime(), now = new Date();
  if (!r) { el.textContent = ''; el.className = 'at-hint'; return; }
  var mins = Math.round((r.b - r.a) / 60000);
  var txt = fmtTimeText(isoOf(r.a)) + ' to ' + fmtTimeText(isoOf(r.b)) + (ymd(r.b) !== ymd(r.a) ? ' (next day)' : '') + ' = ' + fmtDur(mins * 60);
  var late = r.b.getTime() > now.getTime() + 60000;
  if (late) txt += '. That is later than now (' + fmtTimeText(isoOf(now)) + ') - please check the hour and AM / PM.';
  el.textContent = txt;
  el.className = 'at-hint' + (late ? ' bad' : '');
}
function saveTime() {
  var kindBtn = document.querySelector('#at-kind [aria-pressed="true"]');
  var err = document.getElementById('at-err');
  var r = readAddTime();
  if (!r) { err.textContent = 'Please fill in the date and both times.'; return; }
  var a = r.a, b = r.b;
  if ((b - a) / 3600000 > 16) { err.textContent = 'That is more than 16 hours. Please check the times.'; return; }
  if (b.getTime() > Date.now() + 60000) { err.textContent = ''; addTimeHint(); return; }     // the red line above already says why
  var note = document.getElementById('at-note').value.trim(), kind = kindBtn ? kindBtn.dataset.val : 'Work', ed = app.editing;
  var req = ed ? act('/api/entry/edit', { id: ed.id, text: ed.text, from: isoOf(a), to: isoOf(b), kind: kind, note: note }, 'Entry changed')
               : act('/api/mark', { from: isoOf(a), to: isoOf(b), kind: kind, note: note }, 'Saved ' + kindWord(kind).toLowerCase() + ' ' + fmtTimeText(isoOf(a)) + ' - ' + fmtTimeText(isoOf(b)));
  req.then(function () { app.editing = null; closeModal(); }, function (e) { err.textContent = e.message; });
}
function deleteEntry(e) {
  if (!e || !confirm('Delete this entry?\n\n' + kindWord(e.k) + ' ' + fmtTimeText(e.s) + ' - ' + fmtTimeText(e.e))) return false;
  act('/api/entry/delete', { id: e.id, text: e.text }, 'Entry deleted');
  return true;
}

/* ======================= reports ======================= */
function repRange() {
  var a = app.rep.anchor || dateOnly(serverNow());
  if (app.rep.mode === 'week') { var s = weekStart(a); return [s, addDays(s, 6)]; }
  var f = new Date(a.getFullYear(), a.getMonth(), 1);
  return [f, new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
function loadReport() {
  var r = repRange(), key = app.rep.mode + ymd(r[0]);
  app.rep.loading = key;
  if (!app.rep.data || app.rep.data.key !== key) renderReports(true);
  api('/api/range?from=' + ymd(r[0]) + '&to=' + ymd(r[1]) + '&light=1').then(function (data) {
    if (app.rep.loading !== key) return;
    data.key = key;
    app.rep.data = data;
    renderReports(false);
  }, function (e) { toast(e.message, true); });
}
function summarize(days) {
  var today = todayStr(), o = { worked: 0, target: 0, bal: 0, workDays: 0, workSec: 0, leave: 0, hol: 0, lunch: 0, brk: 0, away: 0 };
  days.forEach(function (d) {
    o.target += d.tg;
    if (d.d <= today) { o.worked += d.wk; o.lunch += d.l; o.brk += d.b; o.away += d.a; }
    if (d.d <= today) o.bal += d.wk - d.tg;               // today counts as "if you leave now"
    if (d.d < today && d.wk > 0 && d.tg > 0) { o.workDays++; o.workSec += d.wk; }
    if (d.d < today) o.leave += (d.att === 'leave' || d.att === 'absent') ? 1 : d.att === 'half' ? 0.5 : 0;
    else if (d.d === today) o.leave += d.st === 'leave' ? 1 : d.st === 'half' ? 0.5 : 0;
    if (d.st === 'holiday') o.hol++;
  });
  return o;
}
function renderReports(loading) {
  var r = repRange(), mode = app.rep.mode;
  var label = mode === 'week' ? rangeLabel(ymd(r[0]), ymd(r[1])) + ' ' + r[1].getFullYear() : MONTHS[r[0].getMonth()] + ' ' + r[0].getFullYear();
  var isCurrent = ymd(r[0]) <= todayStr() && todayStr() <= ymd(r[1]);
  var h = '<div class="page-head"><div><h2>Reports</h2><p>Your hours by week or month. Click any day to see or fix its details.</p></div></div>';
  h += '<div class="toolbar"><div class="seg" role="group" aria-label="Report period"><button data-act="rep-mode" data-mode="week" aria-pressed="' + (mode === 'week') + '">Week</button><button data-act="rep-mode" data-mode="month" aria-pressed="' + (mode === 'month') + '">Month</button></div>' +
    '<div class="nav"><button class="btn btn-ghost btn-icon" data-act="rep-step" data-dir="-1" aria-label="Previous">' + ICON.left + '</button><span class="lbl">' + label + '</span><button class="btn btn-ghost btn-icon" data-act="rep-step" data-dir="1" aria-label="Next">' + ICON.right + '</button></div>' +
    (isCurrent ? '' : '<button class="btn btn-sm no-print" data-act="rep-now">' + (mode === 'week' ? 'This week' : 'This month') + '</button>') +
    '<span class="spacer"></span><button class="btn btn-sm no-print" data-act="xlsx">' + ICON.down + 'Download timesheet (Excel)</button><button class="btn btn-sm no-print" data-act="print">' + ICON.print + 'Print / PDF</button></div>';
  var data = app.rep.data;
  if (loading || !data) { main.innerHTML = h + '<div class="skeleton"></div>'; return; }
  var days = data.days, o = summarize(days);
  var balNote = isCurrent ? 'if you leave now' : (mode === 'week' ? 'for the week' : 'for the month');
  h += '<div class="kpis">' +
    kpi('Worked', fmtDur(o.worked), 'of ' + fmtDur(o.target) + ' target') +
    kpi('Ahead / behind', signedHtml(o.bal), balNote) +
    kpi('Average day', o.workDays ? fmtDur(o.workSec / o.workDays) : '&ndash;', o.workDays ? 'over ' + plural(o.workDays, 'full day') : 'no full days yet') +
    kpi('Lunch', fmtDur(o.lunch), counts('Lunch') ? 'counted' : 'not counted') +
    kpi('Leave', plural(o.leave, 'day'), o.hol ? plural(o.hol, 'holiday') : 'no holidays') +
    kpi('Breaks &amp; away', fmtDur(o.brk + o.away), 'not counted') + '</div>';
  var cw = Math.min(1132, Math.max(300, main.clientWidth - 40 - 48));
  h += '<section class="card"><div class="card-head"><h3>Hours counted per day</h3></div><div class="card-body">' + barChart(days, { width: cw, height: 230 }) + '</div></section>';
  h += mode === 'week' ? weekTable(days) : monthCalendar(days) + monthWeeks(days);
  main.innerHTML = h;
}
function kpi(k, v, n) { return '<div class="kpi"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="n">' + n + '</div></div>'; }
function stText(d) { return (STATUS[d.st] || '') + (d.hn ? ': ' + esc(d.hn) : '') + attSuffix(d); }
function attLabel(att) { return { full: 'Full day', half: 'Half day', absent: 'No attendance (counts as leave)', leave: 'Leave', holiday: 'Holiday', off: 'Day off', planned: 'Planned' }[att] || ''; }
function attSuffix(d) {
  if ((d.st !== 'work' && d.st !== 'workday') || d.d > todayStr() || !d.att) return '';
  var w = { full: 'full day', half: 'half day', absent: 'no attendance' }[d.att];
  return w ? ' &middot; ' + w + (d.d === todayStr() ? ' so far' : '') : '';
}
function weekTable(days) {
  var today = todayStr(), tot = { wk: 0, tg: 0, l: 0, b: 0, a: 0, bal: 0 };
  var h = '<section class="card"><div class="card-head"><h3>Day by day</h3></div><div class="card-body tbl-wrap"><table class="tbl"><thead><tr><th>Day</th><th>Type</th><th>Start</th><th>End</th><th class="r">Lunch</th><th class="r">Breaks</th><th class="r">Away</th><th class="r">Counted</th><th class="r">Needed</th><th class="r">Ahead / behind</th></tr></thead><tbody>';
  days.forEach(function (d) {
    var future = d.d > today;
    tot.tg += d.tg;
    if (!future) { tot.wk += d.wk; tot.l += d.l; tot.b += d.b; tot.a += d.a; }
    if (d.d <= today) tot.bal += d.wk - d.tg;
    var diff = future ? '<span class="muted">&ndash;</span>' : (d.tg || d.wk ? signedHtml(d.wk - d.tg) : '<span class="muted">&ndash;</span>');
    h += '<tr data-act="day" data-date="' + d.d + '"' + (d.d === today ? ' class="is-today"' : '') + '><td class="strong">' + dayShort(d.d) + '</td><td><span class="st">' + stText(d) + '</span></td>' +
      '<td>' + (d.s ? fmtTime(d.s) : '&ndash;') + '</td><td>' + (d.e ? (d.live ? 'now' : fmtTime(d.e)) : '&ndash;') + '</td>' +
      '<td class="r">' + (d.l ? fmtDur(d.l) : '&ndash;') + '</td><td class="r">' + (d.b ? fmtDur(d.b) : '&ndash;') + '</td><td class="r">' + (d.a ? fmtDur(d.a) : '&ndash;') + '</td>' +
      '<td class="r strong">' + (future ? '&ndash;' : fmtDur(d.wk)) + '</td><td class="r">' + (d.tg ? fmtDur(d.tg) : '&ndash;') + '</td><td class="r">' + diff + '</td></tr>';
  });
  h += '</tbody><tfoot><tr><td colspan="4">Week total</td><td class="r">' + fmtDur(tot.l) + '</td><td class="r">' + fmtDur(tot.b) + '</td><td class="r">' + fmtDur(tot.a) + '</td><td class="r">' + fmtDur(tot.wk) + '</td><td class="r">' + fmtDur(tot.tg) + '</td><td class="r">' + signedHtml(tot.bal) + '</td></tr></tfoot></table></div></section>';
  return h;
}
function monthCalendar(days) {

var MONTH_NUM = { jan: 1, january: 1, feb: 2, february: 2, mar: 3, march: 3, apr: 4, april: 4, may: 5, jun: 6, june: 6, jul: 7, july: 7, aug: 8, august: 8, sep: 9, sept: 9, september: 9, oct: 10, october: 10, nov: 11, november: 11, dec: 12, december: 12 };

  return dt.getMonth() === m - 1 ? ymd(dt) : null;

  { re: /\b(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/g, f: function (m) { return [+m[1], +m[2], +m[3]]; } },
  { re: /\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})\b/g, f: function (m) { return [yearOf(m[3]), +m[2], +m[1]]; } },
  { re: /\b(\d{1,2})(?:st|nd|rd|th)?[\s\-\/.,]*([A-Za-z]{3,9})\.?(?:[\s\-\/.,']+(\d{4}|\d{2})(?!\d))?/g, f: function (m, Y) { var mo = monthOf(m[2]); return mo ? [yearOf(m[3], Y), mo, +m[1]] : null; } },
  { re: /\b([A-Za-z]{3,9})\.?[\s\-]+(\d{1,2})(?:st|nd|rd|th)?\b(?:,?[\s\-]+(\d{4}))?/g, f: function (m, Y) { var mo = monthOf(m[1]); return mo ? [yearOf(m[3], Y), mo, +m[2]] : null; } },
  { re: /\b(\d{1,2})[\/.\-](\d{1,2})\b/g, f: function (m, Y) { return [Y, +m[2], +m[1]]; } }

function cleanName(s) {

    .replace(/\b(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tues?|wed|thurs?|thu|fri|sat|sun)\b\.?/gi, ' ')

    act('/api/day', { date: d, status: k ? k.dataset.val : 'leave' }, (k && k.dataset.val === 'half' ? 'Half-day leave' : 'Leave') + ' marked for ' + dayShort(d).replace(/<[^>]+>/g, ''));
  },
  'toggle-day': function (el) { el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); settingsChanged(); },
  'st-save': function () { saveSettings(); },
  'st-reset': function () { renderSettings(); },
  'theme': function (el) {
    var v = el.dataset.val;
    try { if (v === 'system') localStorage.removeItem('tt-theme'); else localStorage.setItem('tt-theme', v); } catch (e) {}
    applyTheme(v);
    el.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === el)); });
  },
  'idle-allow': function () { askIdle(); },
  'notif-allow': function () { askNotify(); },
  'autostart': function () { openAutostart(); },
  'copy-cmd': function () { copyText(startCmd(false)); },
  'copy-cmd-alt': function () { copyText(startCmd(true)); },
  'quit': function () { quitTracking(); },
  'restart': function () { location.reload(); },
  'close-window': function () { window.close(); },
  'backup-now': function () { backupNow(false); },
  'dl-log': function () { downloadText('TimeLog.csv', T.timelogText(), 'text/csv'); },
  'import-open': function () { openImport(); },
  'imp-folder': function () { pickFolder(); },
  'imp-files': function () { pickFiles(); },
  'imp-do': function () { var r = doImport(); if (r) { closeModal(); refresh(); setView(app.view); } },
  'wiz-go': function (el) { setStep(el.dataset.to); },
  'wiz-fresh': function () { if (!rt.started) startTracking(null); setStep('perms'); },
  'wiz-import': function () { if (doImport()) setStep('perms'); },
  'wiz-done': function () { finishSetup(); },
  'install': function () { doInstall(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (app.menuOpen && (!el || !el.closest('.menu')) && !(el && el.dataset.act === 'menu')) closeMenu();
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
var resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { if (app.view === 'reports' && app.rep.data) renderReports(false); if (app.view === 'today' && !rt.wizStep && rt.owner) renderToday(); }, 150);
});

/* ======================= start ======================= */
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });
boot();
})();
</script>
</body>
</html>
